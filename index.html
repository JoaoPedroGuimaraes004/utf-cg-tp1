<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Defesa de Torres - WebGL 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /*Esconde barras de rolagem */
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 22px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game-over h1 { color: #ff3333; margin-bottom: 10px; font-size: 48px; }
        #restart-btn, #menu-btn {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        #restart-btn:hover, #menu-btn:hover { background-color: #00aaff; }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a6fd6 0%, #0d3d85 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #menu-title {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #7CFC00;
            -webkit-text-stroke: 3px #145214;
            text-shadow:
                0 4px 0 #145214,
                0 8px 12px rgba(0,0,0,0.6);
            margin-bottom: 50px;
            text-align: center;
        }
        #level-grid {
            display: grid;
            grid-template-columns: repeat(2, 140px);
            grid-gap: 24px;
        }
        .level-btn {
            width: 140px;
            height: 140px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(180deg, #8be04d 0%, #4c9a1f 100%);
            border: none;
            border-radius: 14px;
            border-bottom: 6px solid #2f6b12;
            cursor: pointer;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.5);
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
            transition: transform 0.08s ease;
        }
        .level-btn:hover { filter: brightness(1.08); }
        .level-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .level-btn.locked {
            background: linear-gradient(180deg, #9a9a9a 0%, #5c5c5c 100%);
            border-bottom-color: #333;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .level-btn.locked:hover { filter: none; }
        .level-btn.locked:active { transform: none; border-bottom-width: 6px; }

        #pause-btn {
            pointer-events: auto;
            padding: 6px 14px;
            font-size: 16px;
            cursor: pointer;
            background-color: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
        }
        #pause-btn:hover { background-color: rgba(255,255,255,0.3); }

        #pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        #pause-screen h1 { font-size: 42px; margin-bottom: 20px; letter-spacing: 2px; }
        #resume-btn, #pause-menu-btn {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #00cc66;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #resume-btn:hover, #pause-menu-btn:hover { background-color: #00e676; }
        #pause-menu-btn { margin-top: 16px; }

        /* Botão de volume (reaproveitado na tela inicial e na de pause) */
        .volume-control {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .volume-btn {
            width: 48px;
            height: 48px;
            font-size: 22px;
            cursor: pointer;
            background-color: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
        }
        .volume-btn:hover { background-color: rgba(255,255,255,0.3); }
        .volume-panel {
            position: absolute;
            top: 58px;
            right: 0;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.55);
            border-radius: 10px;
            white-space: nowrap;
        }
        .volume-panel.open { display: flex; }
        .volume-slider { width: 140px; cursor: pointer; }

        /* Botões da tela de Game Over */
        #game-over-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    
    <div id="game-container">
        <canvas id="glcanvas"></canvas>

        <!-- Tela inicial: título e seleção de nível -->
        <div id="menu-screen">
            <div class="volume-control">
                <button class="volume-btn" aria-label="Ajustar volume" title="Ajustar volume">🔊</button>
                <div class="volume-panel">
                    <input type="range" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Volume">
                </div>
            </div>

            <div id="menu-title">TOWER DEFENSE</div>
            <div id="level-grid">
                <button id="level1-btn" class="level-btn">NIVEL 1</button>
                <button id="level2-btn" class="level-btn locked">NIVEL 2</button>
                <button id="level3-btn" class="level-btn locked">NIVEL 3</button>
                <button id="level4-btn" class="level-btn locked">NIVEL 4</button>
            </div>
        </div>

        <!-- Vida da torre e pontuação -->
        <div id="hud">
            <div>Vida da Torre: <span id="hp-val" style="color: #00ff88;">100</span> HP</div>
            <div>Pontuação: <span id="score-val" style="color: #ffcc00;">0</span></div>
            <button id="pause-btn">⏸ Pause</button>
        </div>

        <!-- Tela de pausado -->
        <div id="pause-screen">
            <div class="volume-control">
                <button class="volume-btn" aria-label="Ajustar volume" title="Ajustar volume">🔊</button>
                <div class="volume-panel">
                    <input type="range" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Volume">
                </div>
            </div>

            <h1>PAUSADO</h1>
            <button id="resume-btn">Continuar</button>
            <button id="pause-menu-btn">Voltar ao Menu Principal</button>
        </div>

        <!-- Mensagem de Game Over -->
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p>A sua torre foi destruída!</p>
            <p>Pontuação Final: <span id="final-score">0</span></p>
            <div id="game-over-buttons">
                <button id="restart-btn">Jogar Novamente</button>
                <button id="menu-btn">Voltar ao Menu Principal</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
