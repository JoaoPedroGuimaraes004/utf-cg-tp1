<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Defesa de Torres - WebGL 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /*Esconde barras de rolagem */
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 22px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game-over h1 { color: #ff3333; margin-bottom: 10px; font-size: 48px; }
        #restart-btn, #menu-btn, #restart-win-btn, #menu-win-btn {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        #restart-btn:hover, #menu-btn:hover, #restart-win-btn:hover, #menu-win-btn:hover { background-color: #00aaff; }

        /* Tela de Vitória: mesmo layout da de Game Over, título em verde */
        #victory-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #victory-screen h1 { color: #33ff55; margin-bottom: 10px; font-size: 48px; }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/textures/menu/background.png') center center / cover no-repeat;
            display: block;
            z-index: 10;
        }
        #menu-title {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translate(-50%, 0);
            font-family: 'New Rocker', 'Cinzel', serif;
            font-size: 76px;
            font-weight: 400;
            letter-spacing: 3px;
            color: #ffe9b0;
            -webkit-text-stroke: 2px #1a0f00;
            text-shadow:
                0 0 10px rgba(0,0,0,0.9),
                0 0 26px rgba(0,0,0,0.85),
                0 4px 0 #91662b,
                0 10px 18px rgba(0,0,0,0.7);
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }
        .level-btn {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: 'New Rocker', 'Cinzel', serif;
            font-size: 30px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #fff2cf;
            background: transparent;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            white-space: nowrap;
            -webkit-text-stroke: 1.5px #000;
            text-shadow:
                0 0 8px rgba(0,0,0,0.95),
                0 0 18px rgba(0,0,0,0.9),
                2px 2px 0 #000;
            transition: transform 0.12s ease, color 0.12s ease;
        }
        .level-btn:hover { transform: translate(-50%, -50%) scale(1.1); color: #ffffff; }
        .level-btn:active { transform: translate(-50%, -50%) scale(0.95); }
        .level-btn.locked {
            color: rgba(190, 190, 190, 0.55);
            cursor: not-allowed;
        }
        .level-btn.locked:hover { transform: translate(-50%, -50%); color: rgba(190, 190, 190, 0.55); }

        #level1-btn { left: 26.2%; top: 79.9%; }
        #level2-btn { left: 43.8%; top: 79.8%; }
        #level3-btn { left: 58.1%; top: 80.2%; }
        #level4-btn { left: 72.3%; top: 79.9%; }

        #pause-btn {
            pointer-events: auto;
            padding: 6px 14px;
            font-size: 16px;
            cursor: pointer;
            background-color: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
        }
        #pause-btn:hover { background-color: rgba(255,255,255,0.3); }

        #pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        #pause-screen h1 { font-size: 42px; margin-bottom: 20px; letter-spacing: 2px; }
        #resume-btn, #pause-menu-btn {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #00cc66;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #resume-btn:hover, #pause-menu-btn:hover { background-color: #00e676; }
        #pause-menu-btn { margin-top: 16px; }

        /* Botão de volume (reaproveitado na tela inicial e na de pause) */
        .volume-control {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .volume-btn {
            width: 48px;
            height: 48px;
            font-size: 22px;
            cursor: pointer;
            background-color: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
        }
        .volume-btn:hover { background-color: rgba(255,255,255,0.3); }
        .volume-panel {
            position: absolute;
            top: 58px;
            right: 0;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.55);
            border-radius: 10px;
            white-space: nowrap;
        }
        .volume-panel.open { display: flex; }
        .volume-slider { width: 140px; cursor: pointer; }

        /* Botões da tela de Game Over / Vitória */
        #game-over-buttons, #victory-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    
    <div id="game-container">
        <canvas id="glcanvas"></canvas>

        <!-- Tela inicial: título e seleção de nível -->
        <div id="menu-screen">
            <div class="volume-control">
                <button class="volume-btn" aria-label="Ajustar volume" title="Ajustar volume">🔊</button>
                <div class="volume-panel">
                    <input type="range" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Volume">
                </div>
            </div>

            <div id="menu-title">RUINS BEAT DEFENSE</div>
            <button id="level1-btn" class="level-btn">NÍVEL 1</button>
            <button id="level2-btn" class="level-btn">NÍVEL 2</button>
            <button id="level3-btn" class="level-btn">NÍVEL 3</button>
            <button id="level4-btn" class="level-btn">NÍVEL 4</button>
        </div>

        <!-- Vida da torre e pontuação -->
        <div id="hud">
            <div>Vida da Torre: <span id="hp-val" style="color: #00ff88;">100</span> HP</div>
            <div>Pontuação: <span id="score-val" style="color: #ffcc00;">0</span></div>
            <button id="pause-btn">⏸ Pause</button>
        </div>

        <!-- Tela de pausado -->
        <div id="pause-screen">
            <div class="volume-control">
                <button class="volume-btn" aria-label="Ajustar volume" title="Ajustar volume">🔊</button>
                <div class="volume-panel">
                    <input type="range" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Volume">
                </div>
            </div>

            <h1>PAUSADO</h1>
            <button id="resume-btn">Continuar</button>
            <button id="pause-menu-btn">Voltar ao Menu Principal</button>
        </div>

        <!-- Mensagem de Game Over -->
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p>A sua torre foi destruída!</p>
            <p>Pontuação Final: <span id="final-score">0</span></p>
            <div id="game-over-buttons">
                <button id="restart-btn">Jogar Novamente</button>
                <button id="menu-btn">Voltar ao Menu Principal</button>
            </div>
        </div>

        <!-- Mensagem de Vitória -->
        <div id="victory-screen">
            <h1>VITÓRIA!</h1>
            <p>Você defendeu a torre até o fim da música!</p>
            <p>Pontuação Final: <span id="final-score-win">0</span></p>
            <div id="victory-buttons">
                <button id="restart-win-btn">Jogar Novamente</button>
                <button id="menu-win-btn">Voltar ao Menu Principal</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
