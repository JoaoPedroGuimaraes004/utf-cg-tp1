<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Defesa de Torres - WebGL 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /*Esconde barras de rolagem */
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 22px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game-over h1 { color: #ff3333; margin-bottom: 10px; font-size: 48px; }
        #restart-btn {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        #restart-btn:hover { background-color: #00aaff; }
    </style>
</head>
<body>
    
    <div id="game-container">
        <canvas id="glcanvas"></canvas>

        /* Vida da torre e pontuação */
        <div id="hud">
            <div>Vida da Torre: <span id="hp-val" style="color: #00ff88;">100</span> HP</div>
            <div>Pontuação: <span id="score-val" style="color: #ffcc00;">0</span></div>
        </div>

        /* Mensagem de Game Over */
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p>A sua torre foi destruída!</p>
            <p>Pontuação Final: <span id="final-score">0</span></p>
            <button id="restart-btn">Jogar Novamente</button>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
